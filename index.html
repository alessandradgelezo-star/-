<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Литературная карта улиц Дятлово</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="//cdn.knightlab.com/libs/storymapjs/latest/css/storymap.css">
    <script type="text/javascript" src="//cdn.knightlab.com/libs/storymapjs/latest/js/storymap-min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden; }
        #storymap-embed { width: 100%; height: 100%; }
        .sm-slide-separator { display: none !important; }
        .sm-container, .sm-slide, .sm-header, .sm-footer, .sm-map-container { background-color: #ffffff !important; }
        .sm-title, .sm-byline, .sm-description, .sm-slide-content, .sm-nav-btn, .sm-nav-btn span { color: #003366 !important; }
        .leaflet-container { background-color: #f0f0f0 !important; }
    </style>
</head>
<body>
    <div id="storymap-embed"></div>
    <script type="text/javascript">
        var storymap;
        var storymap_url = '//uploads.knightlab.com/storymapjs/8ec900e5c9c3862f3196ce838c0270dd/literaturnaia-karta-ulits-diatlovo/published.json';
        const urlParams = new URLSearchParams(window.location.search);
        
        function onStoryMapTitle(e) {
            document.title = "StoryMapJS: " + e.title;
        }

        function getScriptPath(scriptname) {
            var scriptTags = document.getElementsByTagName('script');
            for(var i = 0; i < scriptTags.length; i++) {
                if(scriptTags[i].src.match(scriptname)) {
                    return scriptTags[i].src.split('?').split('/').slice(0, -1).join('/');
                }
            }
            return '';
        }

        function getStartSlide() {
            var slide = 0;
            if (urlParams.has('start_at_slide')) {
                slide = parseInt(urlParams.get('start_at_slide'), 10);
            }
            return slide;
        }

        // Исправленная функция: убрана ошибка с пустым присваиванием
        function urlJoin(url, concat) {
            var parts = url.split('/').concat(concat.split('/'));
            var result = ;
            for (var i = 0; i < parts.length; i++) {
                if (parts[i] === '..') {
                    result.pop();
                } else if (parts[i] !== '.' && parts[i] !== '') {
                    result.push(parts[i]);
                }
            }
            return result.join('/');
        }

        function buildStoryMap(data) {
            if (!data || !data.storymap) { 
                document.getElementById('storymap-embed').innerHTML = '<h3 style="color:#003366;padding:20px;">Ошибка: не удалось загрузить данные карты.</h3><p style="padding:0 20px;color:#555;">Проверьте, опубликован ли проект в KnightLab.</p>';
                return; 
            }
            var options = { script_path: getScriptPath(/storymap(-min)?\.js/), start_at_slide: getStartSlide() };
            var font = "stock:default";
            if(data.font_css) font = data.font_css;
            if(font.indexOf("stock:") == 0) {
                var font_name = font.split(':');
                var base_url = urlJoin(options.script_path, "../css/fonts");
                font = urlJoin(base_url, "font." + font_name + ".css");
            } else if(!font.match('^(http|https|//)')) {
                font = urlJoin(options.script_path, font);
            }
            KLStoryMap.loadCSS(font, function(){});
            storymap = new KLStoryMap.StoryMap('storymap-embed', data, options, { title: onStoryMapTitle });
        }

        fetch(storymap_url)
            .then(response => { if (!response.ok) throw new Error('Network error'); return response.json(); })
            .then(data => buildStoryMap(data))
            .catch(error => {
                console.error('Ошибка загрузки:', error);
                document.getElementById('storymap-embed').innerHTML = '<h3 style="color:#003366;padding:20px;">Не удалось загрузить карту.</h3><p style="padding:0 20px;color:#555;">Проверьте консоль (F12) или статус публикации в KnightLab.</p>';
            });

        window.onresize = function() { if(storymap) storymap.updateDisplay(); };
    </script>
</body>
</html>
