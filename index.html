<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Литературная карта улиц Дятлово</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="//cdn.knightlab.com/libs/storymapjs/latest/css/storymap.css">

    <style>
    html, body { 
        width: 100%; 
        height: 100%; 
        padding: 0; 
        margin: 0; 
        overflow: hidden; 
        background-color: #f0f0f0; /* Фон на случай, если карта не загрузится */
    }
    #storymap-embed { 
        width: 100%; 
        height: 100%; 
        min-height: 600px; /* Минимальная высота, чтобы блок не схлопнулся */
        position: relative;
    }
    .sm-slide-separator { display: none !important; }
    /* Принудительно задаем белый фон контейнерам карты */
    .sm-container, .sm-slide, .sm-header, .sm-footer, .sm-map-container { 
        background-color: #ffffff !important; 
        height: 100% !important;
        width: 100% !important;
    }
    .sm-title, .sm-byline, .sm-description, .sm-slide-content, .sm-nav-btn, .sm-nav-btn span { 
        color: #003366 !important; 
    }
    .leaflet-container { 
        background-color: #f0f0f0 !important; 
        height: 100% !important;
    }
    /* Если карта не загрузится, покажем сообщение по центру */
    #storymap-embed:empty::after {
        content: "Загрузка карты...";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #555;
        font-size: 18px;
    }
</style>
</head>
